<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>옷의 여유 — 내 옷의 새로운 조합</title><style>
:root{--bg:#f7f5f0;--ink:#252525;--sage:#667a68;--line:#e4e0d7;--muted:#77736d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Malgun Gothic',Arial,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button{background:none;color:inherit;border:0}header{border-bottom:1px solid var(--line);padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;color:var(--sage);letter-spacing:-1px}small,.muted{color:var(--muted)}.badge{font-size:12px;border:1px solid var(--line);padding:6px 12px;border-radius:20px}.tools{display:flex;gap:12px;align-items:center}nav{display:flex;justify-content:center;gap:36px;padding:16px;border-bottom:1px solid var(--line)}nav button.active{color:var(--sage);border-bottom:2px solid var(--sage)}main{max-width:1100px;padding:45px 24px 100px;margin:auto}h1{font-size:clamp(30px,5vw,48px);line-height:1.35;font-weight:500;letter-spacing:-2px;margin:12px 0 20px}h2{font-size:23px;font-weight:500}h3{font-size:17px;font-weight:500}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--sage)}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.between{justify-content:space-between}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;padding:12px 23px;border-radius:5px;margin:8px 6px 8px 0}.primary{background:var(--sage);color:white}.secondary{border:1px solid var(--line);background:transparent}.hero{display:grid;grid-template-columns:1fr 1fr;background:#edeae2;border-radius:12px;overflow:hidden;margin:28px 0}.hero-copy{padding:45px}.hero .look{min-height:360px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card>img{width:100%;height:245px;object-fit:contain;background:#efede8}.copy{padding:20px}.look{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:16px;background:#efede8;height:330px}.look>img{width:100%;height:100%;min-height:0;object-fit:contain}.look>img:first-child{grid-row:span 2}.notice{font-size:13px;color:var(--muted);padding:18px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.fact{border-top:1px solid var(--line);padding:18px 0}.fact b{font-size:26px;font-weight:400;display:block}.chip{display:inline-block;padding:4px 9px;font-size:12px;background:#eef1eb;border-radius:4px;color:var(--sage);margin:3px}select{padding:12px;background:white;border:1px solid var(--line);border-radius:4px;max-width:100%}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:min(800px,92vw);max-height:90vh;background:var(--bg)}dialog::backdrop{background:#25252577}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.detail-grid>img{width:100%;height:340px;object-fit:contain}dl{display:grid;grid-template-columns:90px 1fr;font-size:14px}dt{color:var(--muted)}dd{margin:0 0 12px}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:24px 5%}.error{color:#a45145}li{margin:8px 0}.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px}.close{float:right;font-size:24px}button:focus-visible{outline:2px solid var(--sage);outline-offset:3px}@media(max-width:650px){header{padding:16px 20px}.brand{font-size:21px}.tools{gap:5px}.tools .badge{max-width:135px;text-align:center;font-size:10px}.grid{grid-template-columns:1fr 1fr;gap:12px}.card>img{height:180px}.hero,.detail-grid{grid-template-columns:1fr}.hero-copy{padding:28px}.hero .look{height:320px;min-height:0}.look{height:230px;padding:8px}.copy{padding:14px}main{padding:30px 18px 70px}h1{font-size:34px}.recommend-grid{grid-template-columns:1fr}.facts{gap:8px}.fact b{font-size:23px}nav{gap:28px}.detail-grid>img{height:230px}}
</style></head><body><header><button class="brand" data-page="home">♧ 옷의 여유</button><div class="tools"><span class="badge">GPU 사전 분석 결과 재생</span><button data-page="records">착용 기록</button><button id="about">진행 현황</button></div></header><nav id="nav"><button data-page="home">HOME</button><button data-page="closet">옷장</button><button data-page="outfits">코디</button></nav><main id="app"></main><footer id="footer">현장에서는 AI를 새로 실행하지 않습니다. 데탑 GPU로 실제 계산한 사진과 결과로 서비스 흐름을 체험합니다.</footer><dialog id="modal"></dialog><input id="import" type="file" accept="application/json,.json" hidden><script id="pack" type="application/json">__CAPTURED_PACK__</script><script>
'use strict';
let pack=null,page='home',caseIndex=0,saved=[],records=[];const app=document.querySelector('#app'),modal=document.querySelector('#modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={t_shirt:'티셔츠',polo:'폴로',shirt:'셔츠',sports_jersey:'저지',knit_sweater:'니트',sweatshirt:'맨투맨',tank_top:'민소매',hoodie:'후드',trousers:'바지',jeans:'데님',shorts:'반바지',sneakers:'운동화',dress_shoes:'구두',boots:'부츠',sandals:'샌들',jacket:'재킷',coat:'코트'};
function load(p){if(p?.version!==1||p.mode!=='gpu-capture'||!Array.isArray(p.items)||!p.items.length||p.items.length>30||!Array.isArray(p.cases)||!p.cases.length)throw Error('데탑에서 생성한 GPU 발표 파일을 선택해주세요.');const ids=new Set();for(const i of p.items){if(typeof i.id!=='string'||ids.has(i.id)||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(i.image)||!i.analysis)throw Error('사진이나 분석 정보가 올바르지 않습니다.');ids.add(i.id)}for(const c of p.cases){if(!Array.isArray(c.outfits)||c.outfits.some(o=>!o.evaluation||!o.itemIds?.every(id=>ids.has(id))))throw Error('코디 정보가 올바르지 않습니다.')}pack=p;saved=[];records=[];try{const s=JSON.parse(localStorage.getItem('wardrobe-presentation:'+p.id));if(s){saved=s.saved.filter(id=>ids.has(id));records=s.records.filter(r=>r.ids.every(id=>ids.has(id)))}}catch{}render()}
function persist(){try{localStorage.setItem('wardrobe-presentation:'+pack.id,JSON.stringify({saved,records}))}catch{alert('이 브라우저에서는 기록을 보존하지 못했어요. 창을 닫으면 사라질 수 있어요.')}}
const item=id=>pack.items.find(i=>i.id===id);const recommended=o=>o.evaluation.context==='suitable'&&o.evaluation.visual!=='review'&&(!o.evaluation.decision||o.evaluation.decision==='recommend');
const look=o=>`<div class="look">${o.itemIds.map(id=>`<img src="${esc(item(id).image)}" alt="${esc(item(id).analysis.name)}">`).join('')}</div>`;
function visibleOutfits(){return (pack?.cases[caseIndex]?.outfits||[]).filter(o=>o.itemIds.every(id=>saved.includes(id)))}
function reason(o){return `<div class="chip">${o.evaluation.visual==='cohesive'?'조화로운 조합':o.evaluation.visual==='ordinary'?'편안한 조합':'추가 확인 필요'}</div><p>${esc(o.evaluation.reasons[0]?.observation||'')}</p>`}
function open(html){modal.innerHTML=`<button class="close" aria-label="닫기" onclick="this.closest('dialog').close()">×</button>${html}`;modal.showModal()}
function register(id){const i=item(id),a=i.analysis;open(`<div class="eyebrow">READY FOR YOUR WARDROBE</div><h2>이렇게 등록할까요?</h2><div class="detail-grid"><img src="${esc(i.image)}" alt="선택한 옷"><div><h2>${esc(a.name)}</h2><dl><dt>종류</dt><dd>${esc(labels[a.type]||a.type)}</dd><dt>색상</dt><dd>${esc(a.color)}</dd>${['상의','아우터','원피스'].includes(i.category)?`<dt>소매</dt><dd>${esc({short:'반팔',long:'긴팔',none:'민소매',unknown:'확인 필요'}[a.sleeve])}</dd>`:''}<dt>패턴</dt><dd>${esc(a.pattern||'확인 필요')}</dd></dl><p class="muted">이 사진을 데탑에서 분석한 실제 결과예요. 새 사진 분석과 정보 수정은 실시간 서비스에서 가능합니다.</p><button class="primary" data-register="${esc(id)}">내 옷장에 저장</button></div></div>`)}
function outfitDetail(index){const o=visibleOutfits()[index];if(!o)return;open(`<div class="eyebrow">YOUR OUTFIT</div><h2>오늘은 이 조합, 어때요?</h2>${look(o)}${reason(o)}<p>${esc(o.evaluation.contextReason)}</p><button class="primary" data-wear="${index}">오늘 입을래요</button><small>실제 착용 확정이 아닌, 입을 예정으로 기록해요.</small>`)}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(!pack){app.innerHTML=`<div class="eyebrow">PRESENTATION EDITION</div><h1>내 옷의 새로운 조합을,<br>어디서든.</h1><p class="muted">데탑에서 만든 실제 분석 결과를 불러오면<br>GPU 없이 등록부터 코디·기록까지 시연할 수 있어요.</p><button class="primary" data-import>GPU 발표 파일 불러오기</button><p class="notice">새로운 사진을 현장에서 분석하는 모드가 아닙니다. 가짜 분석 결과를 넣지 않았어요.</p>`;return}
const fits=visibleOutfits(),good=fits.filter(recommended);const title=`<span class="eyebrow">YOUR WARDROBE, REIMAGINED</span>`;
if(page==='home')app.innerHTML=`${title}<h1>있는 옷으로,<br>조금 더 나답게.</h1><p class="muted">새 옷보다 먼저, 내 옷의 가능성부터.</p><section class="hero"><div class="hero-copy"><span class="eyebrow">TODAY'S EDIT</span><h1>익숙한 옷의<br>새로운 조합.</h1><p>옷을 하나씩 등록하고<br>함께 입을 만한 코디를 찾아보세요.</p><button class="primary" data-page="${saved.length?'outfits':'closet'}">${saved.length?'오늘의 코디 보기':'첫 옷 등록하기'} →</button></div>${good[0]?look(good[0]):`<div class="look">${pack.items.slice(0,3).map(i=>`<img src="${esc(i.image)}" alt="준비된 옷">`).join('')}</div>`}</section><div class="facts"><div class="fact"><b>${saved.length}벌</b>나의 옷장</div><div class="fact"><b>${good.length}개</b>확인 가능한 코디</div><div class="fact"><b>${records.length}개</b>입을 예정 기록</div></div><button class="secondary" data-page="closet">옷장에 더 등록하기</button>`;
if(page==='closet')app.innerHTML=`${title}<div class="row between"><h1>나의 옷장</h1><span class="muted">${saved.length}벌 등록</span></div><p class="muted">${saved.length<pack.items.length?'사진을 선택해 분석 결과를 확인하고 등록해보세요.':'내 사진으로 채운 옷장이에요.'}</p><div class="grid">${pack.items.map(i=>`<article class="card"><img src="${esc(i.image)}" alt="${esc(i.analysis.name)}"><div class="copy"><small>${esc(i.category)}</small><h3>${esc(i.analysis.name)}</h3><button class="${saved.includes(i.id)?'secondary':'primary'}" data-photo="${esc(i.id)}">${saved.includes(i.id)?'정보 보기':'분석 결과 확인'}</button>${saved.includes(i.id)?'<span class="chip">등록됨</span>':''}</div></article>`).join('')}</div><p class="notice">발표에 준비된 사진만 사용할 수 있어요. 등록 정보는 현재 브라우저에만 저장됩니다.</p>`;
if(page==='outfits')app.innerHTML=`${title}<h1>오늘, 함께 입을 옷.</h1><div class="row between"><p class="muted">무리하게 개수를 채우지 않고, 제안할 만한 조합만 보여드려요.</p><select id="case" aria-label="분석한 상황 선택">${pack.cases.map((c,n)=>`<option value="${n}" ${caseIndex===n?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div><p class="notice">사전 GPU 평가 · ${esc(pack.cases[caseIndex].seconds)}초 · 현재 등록한 옷으로 구성된 결과만 표시합니다.</p>${good.length?`<div class="grid recommend-grid">${fits.map((o,n)=>recommended(o)?`<article class="card">${look(o)}<div class="copy"><span class="eyebrow">YOUR LOOK</span>${reason(o)}<button class="secondary" data-outfit="${n}">이 코디 자세히 보기 →</button></div></article>`:'').join('')}</div>`:`<div class="empty"><h2>${fits.length?'이번 후보에서는 확신 있는 제안을 찾지 못했어요.':'코디에 사용할 옷을 먼저 등록해주세요.'}</h2><button class="primary" data-page="closet">옷 등록하러 가기</button></div>`}${fits.length>good.length?`<details class="notice"><summary>보류·제외한 후보 ${fits.length-good.length}개</summary>${fits.filter(o=>!recommended(o)).map(o=>`<p>${esc(o.itemIds.map(id=>item(id).analysis.name).join(' + '))}<br>${esc(o.evaluation.reasons[0]?.observation)}</p>`).join('')}</details>`:''}`;
if(page==='records')app.innerHTML=`${title}<h1>차곡차곡, 나의 하루.</h1><p class="muted">내가 고른 코디를 입을 예정으로 모아두었어요.</p>${records.length?`<div class="grid">${records.map((r,n)=>`<article class="card">${look({itemIds:r.ids})}<div class="copy"><small>${esc(r.date)}</small><h3>${esc(r.occasion)}</h3><span class="chip">입을 예정</span><button class="secondary" data-delete="${n}">기록 삭제</button></div></article>`).join('')}</div>`:'<div class="empty">코디를 선택하면 여기에 기록이 남아요.</div>'}<button class="primary" data-page="home">HOME으로 돌아가기</button>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0)}if(b.hasAttribute('data-import'))document.querySelector('#import').click();if(b.dataset.photo)register(b.dataset.photo);if(b.dataset.register){if(!saved.includes(b.dataset.register))saved.push(b.dataset.register);persist();modal.close();page='closet';render()}if(b.dataset.outfit!==undefined)outfitDetail(Number(b.dataset.outfit));if(b.dataset.wear!==undefined){const o=visibleOutfits()[Number(b.dataset.wear)],date=new Date().toLocaleDateString('sv-SE');if(!records.some(r=>r.date===date&&r.ids.join()===o.itemIds.join()))records.unshift({date,ids:o.itemIds,occasion:pack.cases[caseIndex].label});persist();modal.close();page='records';render()}if(b.dataset.delete!==undefined){records.splice(Number(b.dataset.delete),1);persist();render()}});
document.addEventListener('change',e=>{if(e.target.id==='case'){caseIndex=Number(e.target.value);render()}});
document.querySelector('#import').addEventListener('change',async e=>{try{if(e.target.files[0].size>85*1024*1024)throw Error('파일이 너무 큽니다.');load(JSON.parse(await e.target.files[0].text()))}catch(err){alert(err.message)}e.target.value=''});
document.querySelector('#about').onclick=()=>open(`<div class="eyebrow">PROJECT STATUS</div><h2>내 사진에서 코디와 기록까지.</h2><p>실제 구현: Qwen 사진 특징 분석 · 사진 기반 코디 평가 · 옷장 저장 · 착용 예정 기록.</p><p>개선판: 등록 특징 연결 · 관계 근거 분리 · 추천/보류/제외 · 짧은 설명.</p><p>아직 검증 중: 전문가와의 판단 일치, 새 의류의 추천 품질. 구매 활용도·개인화는 미연결.</p><p class="notice">${pack?`GPU 기록 생성: ${esc(pack.capturedAt)}<br>모델: ${esc(pack.model)}<br>프로토콜: ${esc(pack.protocol)}`:'데탑에서 만든 파일이 아직 없습니다.'}<br>이 화면에서는 새 AI 추론을 하지 않습니다.</p><button class="secondary" data-import>다른 발표 파일 불러오기</button>`);
try{const raw=document.querySelector('#pack').textContent.trim();if(raw&&raw!=='__CAPTURED_PACK__')load(JSON.parse(raw));else render()}catch(e){render();app.insertAdjacentHTML('beforeend',`<p class="error">${esc(e.message)}</p>`)}
</script></body></html>
