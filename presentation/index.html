<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>옷의 여유 — 내 옷의 새로운 조합</title><style>
:root{--bg:#f7f5f0;--ink:#252525;--sage:#667a68;--line:#e4e0d7;--muted:#77736d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Malgun Gothic',Arial,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button{background:none;color:inherit;border:0}header{border-bottom:1px solid var(--line);padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;color:var(--sage);letter-spacing:-1px}small,.muted{color:var(--muted)}.badge{font-size:12px;border:1px solid var(--line);padding:6px 12px;border-radius:20px}.tools{display:flex;gap:12px;align-items:center}nav{display:flex;justify-content:center;gap:36px;padding:16px;border-bottom:1px solid var(--line)}nav button.active{color:var(--sage);border-bottom:2px solid var(--sage)}main{max-width:1100px;padding:45px 24px 100px;margin:auto}h1{font-size:clamp(30px,5vw,48px);line-height:1.35;font-weight:500;letter-spacing:-2px;margin:12px 0 20px}h2{font-size:23px;font-weight:500}h3{font-size:17px;font-weight:500}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--sage)}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.between{justify-content:space-between}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;padding:12px 23px;border-radius:5px;margin:8px 6px 8px 0}.primary{background:var(--sage);color:white}.secondary{border:1px solid var(--line);background:transparent}.hero{display:grid;grid-template-columns:1fr 1fr;background:#edeae2;border-radius:12px;overflow:hidden;margin:28px 0}.hero-copy{padding:45px}.hero .look{min-height:360px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card>img{width:100%;height:245px;object-fit:contain;background:#efede8}.copy{padding:20px}.look{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:16px;background:#efede8;height:330px}.look>img{width:100%;height:100%;min-height:0;object-fit:contain}.look>img:first-child{grid-row:span 2}.notice{font-size:13px;color:var(--muted);padding:18px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.fact{border-top:1px solid var(--line);padding:18px 0}.fact b{font-size:26px;font-weight:400;display:block}.chip{display:inline-block;padding:4px 9px;font-size:12px;background:#eef1eb;border-radius:4px;color:var(--sage);margin:3px}select{padding:12px;background:white;border:1px solid var(--line);border-radius:4px;max-width:100%}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:min(800px,92vw);max-height:90vh;background:var(--bg)}dialog::backdrop{background:#25252577}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.detail-grid>img{width:100%;height:340px;object-fit:contain}dl{display:grid;grid-template-columns:90px 1fr;font-size:14px}dt{color:var(--muted)}dd{margin:0 0 12px}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:24px 5%}.error{color:#a45145}li{margin:8px 0}.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px}.close{float:right;font-size:24px}button:focus-visible{outline:2px solid var(--sage);outline-offset:3px}@media(max-width:650px){header{padding:16px 20px}.brand{font-size:21px}.tools{gap:5px}.tools .badge{max-width:135px;text-align:center;font-size:10px}.grid{grid-template-columns:1fr 1fr;gap:12px}.card>img{height:180px}.hero,.detail-grid{grid-template-columns:1fr}.hero-copy{padding:28px}.hero .look{height:320px;min-height:0}.look{height:230px;padding:8px}.copy{padding:14px}main{padding:30px 18px 70px}h1{font-size:34px}.recommend-grid{grid-template-columns:1fr}.facts{gap:8px}.fact b{font-size:23px}nav{gap:28px}.detail-grid>img{height:230px}}
